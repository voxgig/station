# The conformance suite, as its own package.
#
# It is separate from the library for one reason: Cargo resolves EVERY
# dependency in a manifest - dev-dependencies included - before it will build
# anything at all. With `voxgig_omni` in the library's own `[dev-dependencies]`,
# `cargo build` failed outright on a checkout with no omni link under vendor/:
#
#     error: failed to get `voxgig_omni` as a dependency of package `voxgig_station`
#
# That is omni register 4.13, and it is the same leak voxgig/struct#97 fixed
# the same way. `cargo build` in `../` never sees omni, and nothing published
# from `../src` can acquire it. sekreto is different - the LIBRARY depends on
# it (design §10) - so it stays in `../Cargo.toml`.
[package]
name = "voxgig_station_corpus"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
voxgig_station = { path = ".." }

# The suite drives sekreto directly too (envkey derivation). The SAME path
# the library's own dependency resolves to, so it is one crate, not two.
voxgig_sekreto = { path = "../vendor/sekreto" }

# A LITERAL path, because Cargo resolves these at build time and cannot read
# $OMNI_HOME. `../vendor/omni` is a gitignored link created by `make vendor`;
# CI checks omni out to exactly that path.
voxgig_omni = { path = "../vendor/omni" }
