# Releases a station npm package: publishes to npm AND writes the git tag.
#
# Modelled on voxgig/apidef's publish.yml and the reasoning in that repo's
# docs/how-to/release-and-tag.md; the same shape as sekreto's release.yml.
# The parts that are load-bearing are restated here.
#
# ONE FILE, BECAUSE NPM ALLOWS EXACTLY ONE. A trusted publisher is registered
# on npmjs.com against a single workflow FILENAME, so anything that must
# accompany a publish - here, the tag - has to live inside it. A second
# workflow cannot publish whatever permissions it holds: npm rejects the
# exchange and reports a 404, not a 403, so as not to leak whether the
# package exists. Expect to lose an hour to that unless you know it.
#
# TRUSTED PUBLISHING IS PER PACKAGE, and NEITHER station package is
# registered yet. Before the first release of each:
#
#   npm trust github @voxgig/station    --repo voxgig/station \
#     --file release.yml --allow-publish --allow-stage-publish
#   npm trust github @voxgig/station-js --repo voxgig/station \
#     --file release.yml --allow-publish --allow-stage-publish
#
# (Every other @voxgig package registers `publish.yml`; sekreto and this one
# use `release.yml`. Renaming breaks publishing until the npm entry is
# updated, so a rename and the `npm trust` re-run go together.)
#
# THREE JOBS, EACH WITH THE LEAST IT NEEDS. This is the security shape of
# the file, and it is not tidiness:
#
#   build    contents: read.   Three sibling checkouts (omni, plugin,
#                              struct), npm install, the build and the
#                              tests - every third-party script there is,
#                              and no token to reach for. Ends by packing.
#   publish  id-token: write.  Downloads that tarball and publishes it, with
#                              NO CHECKOUT AT ALL.
#   tag      contents: write.  git, and nothing else.
#
# `id-token: write` is a JOB-level grant: it puts
# ACTIONS_ID_TOKEN_REQUEST_URL and _TOKEN in the environment of EVERY process
# in that job. With install, build and three foreign checkouts in the same
# job, any one of them could mint the same token the publish uses and
# exchange it for a registry credential scoped to whatever packages trust
# this repo. checkout is omitted from the publish job for the same reason -
# it persists a git credential into the job's git config for the job's whole
# life.
#
# OIDC cannot create a tag either - its audience is the registry, not
# GitHub - so all three credentials are needed and none substitutes for
# another. And they cannot live in separate FILES: a ref pushed with
# GITHUB_TOKEN does not start another workflow run, so "tag in A, publish on
# the tag" publishes nothing, silently.
#
# PUBLISHING THE TARBALL, NOT THE DIRECTORY, is what allows the publish job
# to skip the checkout, and is better regardless: the bytes the build job
# tested are the bytes that ship. Provenance survives it - libnpmpublish
# computes the attestation subject from the tarball bytes
# (`ssri.fromData(tarballData)`), not from how the tarball was produced.
#
# DEPENDENCIES COME FROM THE REGISTRY HERE, not from sibling checkouts.
# build.yml symlinks ../../sekreto into node_modules because it tests the
# working tree against unreleased siblings; a RELEASE has the opposite job -
# proving the published dependency graph actually resolves. @voxgig/sekreto
# and @voxgig/struct are on npm, so a plain `npm install` suffices.
#
# omni is the exception and stays a checkout: it is not published, and the
# conformance suite loads it through src/omnihome. For typescript it must
# also be BUILT - the test does `require(omnihome() + '/typescript/dist/src')`
# and a fresh checkout has no dist/. The javascript port loads omni's
# SOURCE and needs no build.
#
# VERSION BUMPS ARE NOT AUTOMATED, deliberately. Nothing here commits. It
# reads the version already on the branch, so the bump stays a reviewable
# diff and the release stays a button.
#
# Do NOT run `npm run repo-publish` locally: it publishes over a token and
# bypasses OIDC entirely.

name: release

on:
  push:
    tags:
      - 'typescript/v*'
      - 'javascript/v*'
  workflow_dispatch:
    inputs:
      port:
        description: 'Port to release'
        required: true
        type: choice
        options: [typescript, javascript]
      allow_removals:
        description: 'This release deliberately REMOVES files from the published package'
        required: false
        default: false
        type: boolean

jobs:
  # Everything that runs project code or third-party scripts: three sibling
  # checkouts (omni, plugin, struct), npm install, the build and the tests.
  # It holds NO token - not the registry one, not a repository-write one.
  build:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    outputs:
      port: ${{ steps.resolve.outputs.port }}
      version: ${{ steps.resolve.outputs.version }}
      name: ${{ steps.resolve.outputs.name }}
      tag: ${{ steps.resolve.outputs.tag }}
      tarball: ${{ steps.pack.outputs.tarball }}
      published: ${{ steps.registry.outputs.published }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check out voxgig/omni
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni

      # The C4 suite must RUN in a release, not skip - the same standing
      # build.yml takes. A missing plugin checkout is a broken gate.
      - name: Check out voxgig/plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/plugin
          path: .plugin

      - name: Check out voxgig/struct
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/struct
          path: .struct

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      # RELEASES COME FROM main, INCLUDING FROM THE BUTTON. `gh workflow run
      # --ref` accepts any branch, so without this the Actions UI could
      # publish a feature branch, irreversibly.
      - name: Dispatches must come from main
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "main" ] || {
            echo "::error::dispatch ref is $GITHUB_REF_NAME; releases must come from main"
            exit 1
          }

      - name: Resolve the port and version being released
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PORT='${{ inputs.port }}'
          else
            PORT="${GITHUB_REF_NAME%%/*}"
          fi
          case "$PORT" in
            typescript|javascript) ;;
            *) echo "::error::cannot resolve a port from '$GITHUB_REF_NAME'"; exit 1 ;;
          esac

          VERSION="$(node -p "require('./$PORT/package.json').version")"
          NAME="$(node -p "require('./$PORT/package.json').name")"
          test -n "$VERSION" || { echo "::error::no version in $PORT/package.json"; exit 1; }

          {
            echo "port=$PORT"
            echo "version=$VERSION"
            echo "name=$NAME"
            echo "tag=$PORT/v$VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "$NAME $VERSION -> tag $PORT/v$VERSION"

      # EVERY DECLARED DEPENDENCY MUST ACTUALLY BE ON NPM. @voxgig/station-js
      # requires @voxgig/sekreto-js, which is not published yet: without this
      # the run dies at `npm install` on a raw registry 404 several steps
      # later. A release cannot ship a package whose dependencies a consumer
      # cannot install.
      - name: Declared dependencies must be installable
        env:
          PORT: ${{ steps.resolve.outputs.port }}
        run: |
          set -euo pipefail
          missing=0
          while read -r dep range; do
            [ -n "$dep" ] || continue
            if npm view "$dep" version >/dev/null 2>&1; then
              echo "  ok       $dep@$range"
            else
              echo "::error::$dep ($range) is not on npm - publish it before releasing $PORT"
              missing=1
            fi
          done < <(node -p "
            const d=require('./$PORT/package.json').dependencies||{};
            Object.entries(d).map(([k,v])=>k+' '+v).join('\n')
          ")
          exit $missing

      # A tag pushed by hand must agree with the version it claims. Without
      # this, pushing typescript/v0.0.2 while package.json still says 0.0.1
      # resolves 0.0.1, finds it already published, skips the publish and
      # goes GREEN - leaving a tag with no release behind it.
      - name: A pushed tag must match the package version
        if: ${{ github.event_name == 'push' }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "$TAG" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($TAG)"
            exit 1
          }

      # A TAG CAN BE PUSHED FROM ANY BRANCH, and the dispatch guard above does
      # not cover that path. `git tag typescript/v0.1.1 && git push --tags`
      # from a feature branch arrives here with a ref that satisfies the
      # version check, and publishes that branch irreversibly. Releases come
      # from main on BOTH paths.
      #
      # --is-ancestor, not "equals the tip": a tag legitimately lags main by
      # the time the run starts, and that must still release.
      - name: A pushed tag must point at a commit on main
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          # An explicit refspec: a tag-push checkout has no origin/main, and
          # a bare `git fetch origin main` only writes FETCH_HEAD.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          }
          echo "$GITHUB_REF_NAME is on main"

      # AN EXISTING TAG IS ONLY A PROBLEM IF IT POINTS SOMEWHERE ELSE. A tag
      # already on THIS commit is the idempotent case, which is what makes
      # re-dispatching after a partial release safe.
      - name: Refuse a tag that points at a different commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          AT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" 2>/dev/null || true)"
          if [ -n "$AT" ] && [ "$AT" != "$HEAD_SHA" ]; then
            echo "::error::tag $TAG already exists on $AT, not this commit - bump the version"
            exit 1
          fi
          [ -z "$AT" ] || echo "$TAG already points here; nothing to create"

      # typescript's conformance test requires omni's COMPILED output, and a
      # fresh checkout has no dist/. Unlike sekreto, station's Makefile does
      # not build omni for you - build.yml does it inline, and so must this.
      - name: Build omni (typescript only)
        if: ${{ steps.resolve.outputs.port == 'typescript' }}
        working-directory: .omni/typescript
        run: |
          npm install --no-audit --no-fund
          npm run build

      # No symlinks: the point of a release gate is that the PUBLISHED
      # dependency graph resolves.
      - name: Install from the registry
        working-directory: ${{ steps.resolve.outputs.port }}
        run: npm install

      - name: Test
        working-directory: ${{ steps.resolve.outputs.port }}
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni
          PLUGIN_HOME: ${{ github.workspace }}/.plugin
          STRUCT_HOME: ${{ github.workspace }}/.struct
          STATION_REQUIRE_C4: '1'
        run: npm test

      # Trusted publishing requires npm >= 11.5.1.
      - name: Use a trusted-publishing capable npm
        run: npm install -g npm@latest

      # THE REGISTRY IS THE SOURCE OF TRUTH FOR "IS THIS RELEASED", not the
      # tag. A run can publish and then fail before tagging, leaving a
      # version on npm with nothing pointing at it - and without this check
      # that state is unrecoverable, because the publish dies on "cannot
      # publish over the previously published versions" before the tag job
      # ever runs.
      - name: Is this version already on npm?
        id: registry
        env:
          NAME: ${{ steps.resolve.outputs.name }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm - skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is not on npm - will publish"
          fi

      # SKIPPING THE PUBLISH ASSUMES "SAME VERSION MEANS SAME CODE". That
      # holds only if main has not moved. npm records the source commit as
      # gitHead, so it is checkable; absent gitHead cannot be verified, so
      # warn rather than block - refusing would make recovery impossible.
      - name: A published version must come from this commit
        if: ${{ steps.registry.outputs.published == 'true' }}
        env:
          NAME: ${{ steps.resolve.outputs.name }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          GH="$(npm view "$NAME@$VERSION" gitHead 2>/dev/null || true)"
          if [ -z "$GH" ]; then
            echo "::warning::npm records no gitHead for $VERSION; cannot verify it was built from this commit"
          elif [ "$GH" != "$GITHUB_SHA" ]; then
            echo "::error::npm has $VERSION built from $GH, but this run is $GITHUB_SHA - tagging would point at code the registry does not contain"
            exit 1
          else
            echo "$VERSION on npm was built from this commit"
          fi

      - name: What will ship
        if: ${{ steps.registry.outputs.published == 'false' }}
        working-directory: ${{ steps.resolve.outputs.port }}
        run: npm pack --dry-run

      # A RELEASE MUST NOT SILENTLY DROP A PUBLISHED FILE. Ported from
      # voxgig/omni, where a release from main would have removed three
      # source files a published version carried, with nothing to notice.
      #
      # Removing files IS sometimes right - 0.1.0 drops the browser entry
      # and takes eight files with it - but it should be a decision, not a
      # side effect. Tick `allow_removals` on the dispatch to say so. The
      # tag-push path has no input and so always refuses; that is the less
      # deliberate path and should be.
      - name: A release must not remove published files
        if: ${{ steps.registry.outputs.published == 'false' }}
        env:
          STATION_ALLOW_REMOVALS: ${{ inputs.allow_removals && '1' || '' }}
        run: make pack-diff PORTS=${{ steps.resolve.outputs.port }}

      # The artifact the publish job will ship. Packing HERE, in the job that
      # ran the tests, is what makes "the bytes that were verified are the
      # bytes that ship" true rather than aspirational.
      - name: Pack
        id: pack
        if: ${{ steps.registry.outputs.published == 'false' }}
        working-directory: ${{ steps.resolve.outputs.port }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          TARBALL="$(npm pack --pack-destination "$RUNNER_TEMP/dist" --silent | tail -1)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "packed $TARBALL"

      - name: Upload the tarball
        if: ${{ steps.registry.outputs.published == 'false' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/dist/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  # THE ONLY JOB WITH id-token: write, and it deliberately does NOT check
  # anything out - not this repository, and none of the three siblings the
  # tests need. No project code and no dependency lifecycle script is in
  # scope while the OIDC token exists.
  publish:
    name: npm publish
    needs: build
    if: ${{ needs.build.outputs.published == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Download the tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/dist

      # Trusted publishing requires npm >= 11.5.1, and node-version alone
      # does not guarantee it. `--ignore-scripts` because this is the one
      # install beside the OIDC token: npm itself has no lifecycle scripts,
      # so it costs nothing and closes the last script path.
      - name: Use a trusted-publishing capable npm
        run: npm install -g npm@latest --ignore-scripts

      # Publish BEFORE tagging (the tag job needs this one), so a tag only
      # ever exists for a release that reached the registry. No --provenance:
      # trusted publishing attaches it on its own, and the attestation
      # subject is computed from these tarball bytes.
      - name: Publish to npm
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: |
          set -euo pipefail
          # A PRERELEASE MUST NOT BECOME `latest`: npm publish defaults to
          # the latest dist-tag, handing 0.1.0-beta.1 to every unpinned
          # install.
          case "$VERSION" in
            *-*) DIST=next ;;
            *)   DIST=latest ;;
          esac
          echo "publishing $TARBALL under dist-tag $DIST"
          npm publish "$RUNNER_TEMP/dist/$TARBALL" --access public --tag "$DIST"

  # Runs git and nothing else, so the repository-write credential is never
  # in scope while third-party code runs. Skipped on the push path: the tag
  # already exists there. always() because publish is SKIPPED when the
  # version is already on npm, which is the recovery case this job exists
  # for - a run that published and then failed before tagging.
  tag:
    name: tag
    needs: [build, publish]
    if: >-
      ${{ always()
          && github.event_name == 'workflow_dispatch'
          && needs.build.result == 'success'
          && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Tag the release
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"

          # EXISTENCE IS NOT ENOUGH. `--verify` only asks whether the name
          # resolves; a tag created between the publish job's guard and this
          # checkout could point anywhere. Treating that as idempotent would
          # leave a green run with an artifact from THIS commit and a
          # release tag on a different one.
          AT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" 2>/dev/null || true)"
          if [ -n "$AT" ]; then
            if [ "$AT" != "$HEAD_SHA" ]; then
              echo "::error::$TAG exists on $AT, not this commit ($HEAD_SHA)"
              exit 1
            fi
            echo "$TAG already points here - nothing to do" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
          echo "pushed $TAG" >> "$GITHUB_STEP_SUMMARY"
