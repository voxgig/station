# Releases station: every port with a release route, at the one version in
# VERSION, from one commit, in one run.
#
# Modelled on voxgig/apidef's publish.yml and the reasoning in that repo's
# docs/how-to/release-and-tag.md; the same shape as sekreto's release.yml.
# The parts that are load-bearing are restated here.
#
# EVERY PORT, ONE VERSION. VERSION at the repository root is the version of
# every port, and tools/version.py fails the run if any port declares
# another. A run brings each port up to it: typescript and javascript
# publish to npm and are tagged, go is a tag alone. tools/release_plan.py
# decides what each port still needs. A port already released at VERSION is
# left alone, but only while its directory is unchanged since its tag, so
# one version never names two trees of a port. Every tag is pushed in one
# atomic push, after every publish has succeeded and the go module has
# passed as a consumer resolves it.
#
# ONE FILE, BECAUSE NPM ALLOWS EXACTLY ONE. A trusted publisher is registered
# on npmjs.com against a single workflow FILENAME, so anything that must
# accompany a publish - here, the tags - has to live inside it. A second
# workflow cannot publish whatever permissions it holds: npm rejects the
# exchange and reports a 404, not a 403, so as not to leak whether the
# package exists. Expect to lose an hour to that unless you know it.
#
# TRUSTED PUBLISHING IS PER PACKAGE. Both station packages are registered
# against this file; a new package needs its own entry first:
#
#   npm trust github @voxgig/<package> --repo voxgig/station \
#     --file release.yml --allow-publish --allow-stage-publish
#
# (Every other @voxgig package registers `publish.yml`; sekreto and this one
# use `release.yml`. Renaming breaks publishing until the npm entry is
# updated, so a rename and the `npm trust` re-run go together.)
#
# EACH JOB HOLDS THE LEAST IT NEEDS. This is the security shape of the file,
# and it is not tidiness:
#
#   plan     contents: read.   Reads VERSION, the tags and the registry.
#   npm      contents: read.   Per npm port: three sibling checkouts (omni,
#                              plugin, struct), npm install, the build and
#                              the tests - every third-party script there
#                              is, and no token to reach for. Ends by packing.
#   go       contents: read.   Builds and tests the go module.
#   publish  id-token: write.  Per npm port: downloads that tarball and
#                              publishes it, with NO CHECKOUT AT ALL.
#   tag      contents: write.  git, and nothing else.
#
# `id-token: write` is a JOB-level grant: it puts
# ACTIONS_ID_TOKEN_REQUEST_URL and _TOKEN in the environment of EVERY process
# in that job. With install, build and three foreign checkouts in the same
# job, any one of them could mint the same token the publish uses and
# exchange it for a registry credential scoped to whatever packages trust
# this repo. checkout is omitted from the publish job for the same reason -
# it persists a git credential into the job's git config for the job's whole
# life.
#
# OIDC cannot create a tag either - its audience is the registry, not
# GitHub - so all three credentials are needed and none substitutes for
# another. And they cannot live in separate FILES: a ref pushed with
# GITHUB_TOKEN does not start another workflow run, so "tag in A, publish on
# the tag" publishes nothing, silently.
#
# PUBLISHING THE TARBALL, NOT THE DIRECTORY, is what allows the publish job
# to skip the checkout, and is better regardless: the bytes the npm job
# tested are the bytes that ship. Provenance survives it - libnpmpublish
# computes the attestation subject from the tarball bytes, not from how the
# tarball was produced. It also means npm records no gitHead: the source
# commit lives in the provenance attestation, which is where
# tools/release_plan.py reads it.
#
# DEPENDENCIES COME FROM THE REGISTRY HERE, not from sibling checkouts.
# build.yml symlinks ../../sekreto into node_modules because it tests the
# working tree against unreleased siblings; a RELEASE has the opposite job -
# proving the published dependency graph actually resolves. The go module
# likewise resolves from the module proxy, with no workspace.
#
# omni is the exception and stays a checkout: it is not a dependency of any
# shipped port, and the conformance suite loads it through src/omnihome. For
# typescript it must also be BUILT - the test does
# `require(omnihome() + '/typescript/dist/src')` and a fresh checkout has no
# dist/. The javascript port loads omni's SOURCE and needs no build.
#
# VERSION BUMPS ARE NOT AUTOMATED, deliberately. Nothing here commits.
# `make version-set V=X.Y.Z` is the bump, in a reviewed PR, and the release
# stays a button.
#
# Do NOT run `npm run repo-publish` locally: it publishes over a token and
# bypasses OIDC entirely.

name: release

on:
  push:
    tags:
      - 'typescript/v*'
      - 'javascript/v*'
      - 'go/v*'
  workflow_dispatch:
    inputs:
      allow_removals:
        description: 'This release deliberately REMOVES files from a published package'
        required: false
        default: false
        type: boolean

# A dispatch and a hand-pushed tag must not race each other to the registry.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      tags: ${{ steps.plan.outputs.tags }}
      go: ${{ steps.plan.outputs.go }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # RELEASES COME FROM main, INCLUDING FROM THE BUTTON. `gh workflow run
      # --ref` accepts any branch, so without this the Actions UI could
      # publish a feature branch, irreversibly.
      - name: Dispatches must come from main
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "main" ] || {
            echo "::error::dispatch ref is $GITHUB_REF_NAME; releases must come from main"
            exit 1
          }

      # A TAG CAN BE PUSHED FROM ANY BRANCH, and the dispatch guard above does
      # not cover that path. --is-ancestor, not "equals the tip": a tag
      # legitimately lags main by the time the run starts.
      - name: A pushed tag must point at a commit on main
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          # An explicit refspec: a tag-push checkout has no origin/main, and
          # a bare `git fetch origin main` only writes FETCH_HEAD.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          }
          echo "$GITHUB_REF_NAME is on main"

      - name: Every port declares the version in VERSION
        run: python3 tools/version.py --check

      # A pushed tag must be one of this version's port tags: pushing
      # typescript/v0.3.0 while VERSION says 0.2.0 is refused, not read as
      # a request to release 0.2.0.
      - name: Plan each port
        id: plan
        env:
          PUSHED_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/release_plan.py --pushed-tag "$PUSHED_TAG" \
            --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Everything that runs project code or third-party scripts for an npm port.
  # It holds NO token - not the registry one, not a repository-write one.
  npm:
    name: build and check ${{ matrix.port }}
    needs: plan
    if: ${{ needs.plan.outputs.publish != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    strategy:
      matrix:
        port: ${{ fromJSON(needs.plan.outputs.publish) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out voxgig/omni
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          path: .omni

      # The C4 suite must RUN in a release, not skip - the same standing
      # build.yml takes. A missing plugin checkout is a broken gate.
      - name: Check out voxgig/plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/plugin
          path: .plugin

      - name: Check out voxgig/struct
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/struct
          path: .struct

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      # EVERY DECLARED DEPENDENCY MUST ACTUALLY BE ON NPM. A release cannot
      # ship a package whose dependencies a consumer cannot install, and
      # without this the run dies at `npm install` on a raw registry 404.
      - name: Declared dependencies must be installable
        env:
          PORT: ${{ matrix.port }}
        run: |
          set -euo pipefail
          missing=0
          while read -r dep range; do
            [ -n "$dep" ] || continue
            if npm view "$dep" version >/dev/null 2>&1; then
              echo "  ok       $dep@$range"
            else
              echo "::error::$dep ($range) is not on npm - publish it before releasing $PORT"
              missing=1
            fi
          done < <(node -p "
            const d=require('./$PORT/package.json').dependencies||{};
            Object.entries(d).map(([k,v])=>k+' '+v).join('\n')
          ")
          exit $missing

      - name: Build omni (typescript only)
        if: ${{ matrix.port == 'typescript' }}
        working-directory: .omni/typescript
        run: |
          npm install --no-audit --no-fund
          npm run build

      # No symlinks: the point of a release gate is that the PUBLISHED
      # dependency graph resolves.
      - name: Install from the registry
        working-directory: ${{ matrix.port }}
        run: npm install

      - name: Test
        working-directory: ${{ matrix.port }}
        env:
          OMNI_HOME: ${{ github.workspace }}/.omni
          PLUGIN_HOME: ${{ github.workspace }}/.plugin
          STRUCT_HOME: ${{ github.workspace }}/.struct
          STATION_REQUIRE_C4: '1'
        run: npm test

      # Trusted publishing requires npm >= 11.5.1.
      - name: Use a trusted-publishing capable npm
        run: npm install -g npm@latest

      - name: What will ship
        working-directory: ${{ matrix.port }}
        run: npm pack --dry-run

      # A RELEASE MUST NOT SILENTLY DROP A PUBLISHED FILE. Removing files IS
      # sometimes right, but it should be a decision, not a side effect: tick
      # `allow_removals` on the dispatch to say so. The tag-push path has no
      # input and so always refuses; that is the less deliberate path and
      # should be. `make pack-diff` runs `version-check` first.
      - name: A release must not remove published files
        env:
          STATION_ALLOW_REMOVALS: ${{ inputs.allow_removals && '1' || '' }}
          PORT: ${{ matrix.port }}
        run: make pack-diff PORTS="$PORT"

      # Packing HERE, in the job that ran the tests, is what makes "the bytes
      # that were verified are the bytes that ship" true.
      - name: Pack
        working-directory: ${{ matrix.port }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist"
          npm pack --pack-destination "$RUNNER_TEMP/dist" --silent

      - name: Upload the tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-tarball-${{ matrix.port }}
          path: ${{ runner.temp }}/dist/*.tgz
          if-no-files-found: error
          retention-days: 1

  # A go tag cannot be taken back: proxy.golang.org caches the version for
  # good. So the module must pass as a consumer resolves it - no workspace,
  # every requirement from the proxy, checked against go.sum - before any
  # tag is pushed, and before anything publishes.
  go:
    name: check go
    needs: plan
    if: ${{ needs.plan.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24'
          cache-dependency-path: go/go.sum

      # A replace applies to this build and never to a consumer's, so a
      # module that passes here because of one would fail for everyone else.
      - name: The module must carry no replace directive
        working-directory: go
        run: |
          set -euo pipefail
          go mod edit -json | python3 -c 'import json, sys; sys.exit("go.mod has a replace directive" if json.load(sys.stdin).get("Replace") else 0)'

      - name: The module builds and passes its tests outside a workspace
        working-directory: go
        env:
          GOWORK: 'off'
        run: |
          go build ./...
          go test -count=1 ./...

  # THE ONLY JOB WITH id-token: write, and it deliberately does NOT check
  # anything out - not this repository, and none of the three siblings the
  # tests need. No project code and no dependency lifecycle script is in
  # scope while the OIDC token exists. It waits for the go check too: a run
  # whose go module fails publishes nothing, rather than leaving npm at a
  # version go can never be tagged at from the same commit.
  publish:
    name: npm publish ${{ matrix.port }}
    needs: [plan, npm, go]
    if: >-
      ${{ always()
          && needs.plan.result == 'success'
          && needs.plan.outputs.publish != '[]'
          && needs.npm.result == 'success'
          && (needs.go.result == 'success' || needs.go.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        port: ${{ fromJSON(needs.plan.outputs.publish) }}

    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Download the tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-tarball-${{ matrix.port }}
          path: ${{ runner.temp }}/dist

      # `--ignore-scripts` because this is the one install beside the OIDC
      # token: npm itself has no lifecycle scripts, so it costs nothing and
      # closes the last script path.
      - name: Use a trusted-publishing capable npm
        run: npm install -g npm@latest --ignore-scripts

      # No --provenance: trusted publishing attaches it on its own. A
      # PRERELEASE MUST NOT BECOME `latest`: npm publish defaults to the
      # latest dist-tag, handing 0.3.0-beta.1 to every unpinned install.
      - name: Publish to npm
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            *-*) DIST=next ;;
            *)   DIST=latest ;;
          esac
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP"/dist/*.tgz)
          [ "${#tarballs[@]}" -eq 1 ] || {
            echo "::error::expected one tarball, found ${#tarballs[@]}"
            exit 1
          }
          echo "publishing ${tarballs[0]} under dist-tag $DIST"
          npm publish "${tarballs[0]}" --access public --tag "$DIST"

  # Runs git and nothing else, so the repository-write credential is never in
  # scope while third-party code runs. always() because the jobs before it
  # are SKIPPED when there is nothing for them to do - a version already on
  # npm, or no npm port to publish - and that is the case this job finishes:
  # a run that published and then failed before tagging. Every tag goes in
  # one atomic push, so a release never ends with some ports tagged.
  tag:
    name: tag
    needs: [plan, npm, go, publish]
    if: >-
      ${{ always()
          && needs.plan.result == 'success'
          && needs.plan.outputs.tags != ''
          && (needs.npm.result == 'success' || needs.npm.result == 'skipped')
          && (needs.go.result == 'success' || needs.go.result == 'skipped')
          && (needs.publish.result == 'success' || needs.publish.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # EXISTENCE IS NOT ENOUGH. A tag created between the plan and this
      # checkout could point anywhere; treating that as done would leave a
      # green run with an artifact from THIS commit and a tag on another.
      - name: Tag every port
        env:
          TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          new=()
          for TAG in $TAGS; do
            AT="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" 2>/dev/null || true)"
            if [ -n "$AT" ]; then
              if [ "$AT" != "$HEAD_SHA" ]; then
                echo "::error::$TAG exists on $AT, not this commit ($HEAD_SHA)"
                exit 1
              fi
              echo "$TAG already points here" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            git tag "$TAG"
            new+=("refs/tags/$TAG")
          done
          if [ "${#new[@]}" -gt 0 ]; then
            git push --atomic origin "${new[@]}"
            printf 'pushed %s\n' "${new[@]}" >> "$GITHUB_STEP_SUMMARY"
          fi
