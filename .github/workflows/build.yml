# Conformance in CI for every shipped library (station design §13):
# each port runs its unit suite plus the shared spec/station.json
# corpus through the sibling voxgig/omni runner. The integration
# suites that need generated SDKs skip cleanly here until the
# package-side fixture-consumer lane (§9.5) covers them.
#
# Sibling checkouts: omni and sekreto are PINNED (build infrastructure
# - a green run means the same thing tomorrow; bump the ref when
# adopting a sibling change). plugin is deliberately UNPINNED: the C4
# suite runs plugin's corpus against station's own implementation, and
# drift going red here is that contract working, not a flake.
#
# Every port step is `continue-on-error` with an id, and the final
# `result` step fails the job naming each red port. Without that the
# job stops at the first failure and the ports after it never run - on
# the activation run that hid c and cpp behind a rust failure, so a
# suite whose whole purpose is naming the port that disagrees named
# one and hid two.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: station
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/omni
          ref: dcbab7aa3f79ed99663ba8f70a79b5721fd5092d # omni#36
          path: omni
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/sekreto
          ref: 7b603824e56fa4255998fc1e7105463ef87dd5a3 # sekreto#7
          path: sekreto
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: voxgig/plugin
          path: plugin

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: typescript
        id: typescript
        continue-on-error: true
        env:
          # The C4 suite must RUN here, not skip: a missing plugin
          # checkout is a broken lane, not an optional extra.
          STATION_REQUIRE_C4: '1'
        run: |
          cd station/typescript
          mkdir -p node_modules/@voxgig
          ln -sfn ../../../../sekreto/typescript node_modules/@voxgig/sekreto
          ln -sfn ../../../../omni/typescript node_modules/@voxgig/omni
          (cd ../../omni/typescript && npm install --no-audit --no-fund && npm run build)
          (cd ../../sekreto/typescript && npm install --no-audit --no-fund && npm run build)
          npm install --no-save --no-audit --no-fund typescript @types/node
          npm test
      - name: javascript
        id: javascript
        continue-on-error: true
        run: |
          cd station/javascript
          mkdir -p node_modules/@voxgig
          ln -sfn ../../../../sekreto/javascript node_modules/@voxgig/sekreto-js
          npm test
      # Register 4.13 (omni): the conformance suite is a nested module
      # (go/testutil), so the published module must build - and its
      # tests resolve - naming no omni. GOWORK=off makes the proof hold
      # even with the omni checkout on disk: a leaked require would go
      # to the module proxy and fail.
      - name: go builds without omni
        id: go-no-omni
        continue-on-error: true
        env:
          SEKRETO_HOME: ${{ github.workspace }}/sekreto
        run: make -C station/go build-clean
      - name: go
        id: go
        continue-on-error: true
        run: make -C station/go test
      - name: python
        id: python
        continue-on-error: true
        run: make -C station/python test
      - name: ruby
        id: ruby
        continue-on-error: true
        run: |
          cd station/ruby
          ruby test/station_test.rb
          ruby test/conform_test.rb
          ruby test/quickstart_test.rb
      - name: php
        id: php
        continue-on-error: true
        run: cd station/php && php test/run.php
      - name: perl
        id: perl
        continue-on-error: true
        run: make -C station/perl test
      - name: java
        id: java
        continue-on-error: true
        run: make -C station/java test
      # `make test`, not a bare `cargo test`: Cargo.toml names path
      # dependencies under vendor/, and the Makefile's `vendor` target is
      # what links them to the sibling checkouts. Calling cargo directly
      # skips it and the build cannot resolve voxgig_sekreto.
      # Register 4.13 (omni): the conformance suite is a separate
      # package (rust/corpus). Only vendor/sekreto is linked - the
      # library genuinely depends on it - and the build must pass with
      # no omni link present.
      - name: rust builds without omni
        id: rust-no-omni
        continue-on-error: true
        env:
          SEKRETO_HOME: ${{ github.workspace }}/sekreto
        run: make -C station/rust build-clean
      - name: rust
        id: rust
        continue-on-error: true
        env:
          SEKRETO_HOME: ${{ github.workspace }}/sekreto
          OMNI_HOME: ${{ github.workspace }}/omni
        run: make -C station/rust test
      - name: c
        id: c
        continue-on-error: true
        run: make -C station/c test
      - name: cpp
        id: cpp
        continue-on-error: true
        run: make -C station/cpp test

      - name: result
        if: always()
        env:
          OUTCOMES: |
            typescript ${{ steps.typescript.outcome }}
            javascript ${{ steps.javascript.outcome }}
            go ${{ steps.go.outcome }}
            go-no-omni ${{ steps.go-no-omni.outcome }}
            python ${{ steps.python.outcome }}
            ruby ${{ steps.ruby.outcome }}
            php ${{ steps.php.outcome }}
            perl ${{ steps.perl.outcome }}
            java ${{ steps.java.outcome }}
            rust ${{ steps.rust.outcome }}
            rust-no-omni ${{ steps.rust-no-omni.outcome }}
            c ${{ steps.c.outcome }}
            cpp ${{ steps.cpp.outcome }}
        run: |
          # `NF` is load-bearing: the YAML block scalar ends with a newline,
          # so the stream carries a trailing blank line. Without the guard
          # awk matches it ($2 is empty, so != "success"), prints an empty
          # $1, and the job fails naming no port at all.
          printf '%s\n' "$OUTCOMES" | awk 'NF'
          red=$(printf '%s\n' "$OUTCOMES" |
            awk 'NF && $2 != "success" { printf "%s ", $1 }' | sed 's/ *$//')
          if [ -n "$red" ]; then
            echo "::error::red ports: $red"
            exit 1
          fi
          echo "all $(printf '%s\n' "$OUTCOMES" | awk 'NF' | wc -l) ports green"
