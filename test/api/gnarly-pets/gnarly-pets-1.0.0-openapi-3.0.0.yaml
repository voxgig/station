openapi: 3.0.0
info:
  title: Gnarly Pets API
  version: 1.0.0

servers:
  - url: http://localhost:8903

security:
  - petToken: []

paths:
  /api/pet:
    get:
      summary: List pets
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: size
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      summary: Create pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /api/pet/{pet_id}:
    get:
      summary: Get pet
      parameters:
        - name: pet_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    put:
      summary: Update pet
      parameters:
        - name: pet_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
    delete:
      summary: Delete pet
      parameters:
        - name: pet_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /api/pet/{pet_id}/visit:
    get:
      summary: List visits for pet
      parameters:
        - name: pet_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Visit'
    post:
      summary: Create visit
      parameters:
        - name: pet_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Visit'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'
  /api/pet/{pet_id}/visit/{visit_id}:
    get:
      summary: Get visit
      parameters:
        - name: pet_id
          in: path
          required: true
          schema:
            type: string
        - name: visit_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Visit'

components:
  securitySchemes:
    petToken:
      type: http
      scheme: bearer
  schemas:
    Pet:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        species:
          type: string
        grumpy:
          type: boolean
      required:
        - name
    Visit:
      type: object
      properties:
        id:
          type: string
        reason:
          type: string
        when:
          type: string
      required:
        - reason
